name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  # Runners are pinned to ubuntu-24.04 because that image has clang-18 and
  # libclang pre-installed (ubuntu-latest, now 26.04, has no llvm-18).
  # Point bindgen at it so we can skip apt-get install libclang-dev.
  LIBCLANG_PATH: /usr/lib/llvm-18/lib

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          release-type: rust

  build:
    name: Build release binary (musl)
    runs-on: ubuntu-24.04
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get install -y musl-tools

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: pg-migration-lint
          path: target/x86_64-unknown-linux-musl/release/pg-migration-lint
          if-no-files-found: error

  build-bridge:
    name: Build Liquibase bridge JAR
    runs-on: ubuntu-24.04
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build fat JAR with Maven (via Docker)
        run: |
          docker run --rm \
            -v "$PWD/bridge:/build" \
            -w /build \
            maven:3.9-eclipse-temurin-21 \
            sh -c 'mvn package -q -DskipTests && cp target/liquibase-bridge-1.0.0.jar target/liquibase-bridge.jar'

      - name: Upload bridge JAR
        uses: actions/upload-artifact@v7
        with:
          name: liquibase-bridge
          path: bridge/target/liquibase-bridge.jar
          if-no-files-found: error

  upload-assets:
    name: Upload release assets
    runs-on: ubuntu-24.04
    needs: [release-please, build, build-bridge]
    steps:
      - name: Download release binary
        uses: actions/download-artifact@v8
        with:
          name: pg-migration-lint
          path: artifacts

      - name: Download bridge JAR
        uses: actions/download-artifact@v8
        with:
          name: liquibase-bridge
          path: artifacts

      - name: Prepare release assets
        run: |
          chmod +x artifacts/pg-migration-lint
          tar -czf pg-migration-lint-x86_64-linux.tar.gz -C artifacts pg-migration-lint
          sha256sum pg-migration-lint-x86_64-linux.tar.gz > pg-migration-lint-x86_64-linux.tar.gz.sha256
          cp artifacts/liquibase-bridge.jar liquibase-bridge.jar

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            pg-migration-lint-x86_64-linux.tar.gz
            pg-migration-lint-x86_64-linux.tar.gz.sha256
            liquibase-bridge.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs after upload-assets, so a release whose binary never got uploaded
  # leaves the major version tag where it was. GITHUB_TOKEN cannot get the
  # workflows permission, so moving the tag past a change to
  # .github/workflows can fail with HTTP 403. The step then fails and prints
  # the manual move: git fetch origin, then
  # git push --force origin <release sha>:refs/tags/vN
  move-major-tag:
    name: Move major version tag
    runs-on: ubuntu-24.04
    needs: [release-please, upload-assets]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    steps:
      - name: Point the major version tag at the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^(v[0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Release tag '${TAG_NAME}' is not vX.Y.Z, so there is no major version tag to move."
            exit 0
          fi
          major="${BASH_REMATCH[1]}"
          if ! sha="$(gh api "repos/${REPO}/commits/${TAG_NAME}" --jq .sha)"; then
            echo "::error::Could not look up the commit of ${TAG_NAME}, so ${major} was not moved. Re-run this job."
            exit 1
          fi

          if ! major_refs="$(gh api "repos/${REPO}/git/matching-refs/tags/${major}" --paginate)"; then
            echo "::error::Could not list the ${major} tags of ${REPO}, so ${major} was not moved. Re-run this job."
            exit 1
          fi
          current_sha="$(jq -r --arg ref "refs/tags/${major}" '.[] | select(.ref == $ref) | .object.sha' <<<"$major_refs")"

          if [[ "$current_sha" == "$sha" ]]; then
            echo "${major} already points at ${TAG_NAME} (${sha})."
            exit 0
          fi

          if [[ -n "$current_sha" ]]; then
            current_version="$(jq -r --arg sha "$current_sha" '.[] | select(.object.sha == $sha) | .ref | ltrimstr("refs/tags/")' <<<"$major_refs" \
              | { grep -E "^${major}\.[0-9]+\.[0-9]+$" || true; } | sort -V | tail -n 1)"
            if [[ -z "$current_version" ]]; then
              echo "::notice::${major} points at ${current_sha}, which no ${major}.x.y tag points at, so there is no version to compare ${TAG_NAME} with. Moving it anyway."
            elif [[ "$(printf '%s\n' "$current_version" "$TAG_NAME" | sort -V | tail -n 1)" != "$TAG_NAME" ]]; then
              echo "::notice::${major} points at ${current_version}, which is newer than ${TAG_NAME}, so it stays there."
              exit 0
            fi
            move=(--method PATCH "repos/${REPO}/git/refs/tags/${major}" -F force=true)
          else
            move=(--method POST "repos/${REPO}/git/refs" -f ref="refs/tags/${major}")
          fi

          if ! gh api "${move[@]}" -f sha="$sha" --silent; then
            echo "::error::Could not move ${major} to ${TAG_NAME} (${sha}). If the error above is an HTTP 403 or mentions the workflows permission, the move probably spans a change to .github/workflows, which GITHUB_TOKEN cannot do. Move the tag by hand: run git fetch origin so the commit is available locally, then git push --force origin ${sha}:refs/tags/${major}"
            exit 1
          fi
          echo "Moved ${major} to ${TAG_NAME} (${sha})."
