name: Verify PostgreSQL Behavior

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  verify:
    name: Verify PG behavior claims
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: verify/lock-tests

      - name: Start PostgreSQL 14-18
        run: cd verify && docker compose up -d --wait

      - name: Verify single-session claims (SQL suite)
        run: |
          chmod +x verify/run.sh verify/lib/runner.sh
          cd verify && ./run.sh --verbose --no-teardown

      - name: Verify lock behaviour (Rust suite)
        env:
          PG_LOCK_TESTS_REQUIRE_ALL: "1"
        run: cd verify/lock-tests && cargo test

      - name: Stop containers
        if: always()
        run: cd verify && docker compose down

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-verify-results
          path: verify/
          retention-days: 30
