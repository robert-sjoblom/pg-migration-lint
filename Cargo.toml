[package]
name = "pg-migration-lint"
version = "2.15.0"
edition = "2024"
authors = ["pg-migration-lint contributors"]
description = "Static analyzer for PostgreSQL migration files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robert-sjoblom/pg-migration-lint"

[[bin]]
name = "pg-migration-lint"
path = "src/main.rs"

[lib]
name = "pg_migration_lint"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
pg_query = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0.3"
thiserror = "2.0"
anyhow = "1.0"
strum = { version = "0.28.0", features = ["strum_macros"] }
strum_macros = "0.28.0"
# `default-features = false` + explicit `features` below reproduces
# octocrab's own `default` feature list (see its `Cargo.toml`) except
# swapping `jwt-rust-crypto` for `jwt-aws-lc-rs`. octocrab only needs JWT
# signing for GitHub App authentication, which this crate never uses (see
# `src/github/mod.rs`: auth is a plain `personal_token`). `jwt-rust-crypto`
# enables jsonwebtoken's `rust_crypto` backend, which pulls in the `rsa`
# crate (RUSTSEC-2023-0071, "Marvin Attack" timing sidechannel) via
# `num-bigint-dig`. `jwt-aws-lc-rs` enables jsonwebtoken's `aws_lc_rs`
# backend instead, avoiding `rsa` entirely while keeping the dependency
# buildable (the JWT code path itself is dead code for us either way).
#
# Pinned to the resolved minor version rather than an open `>=` bound: an
# unbounded requirement lets a lockfile-less build (`cargo install` from
# source, a fresh `cargo update`) resolve any future release as in-range,
# including a semver-major one, which would silently break the
# `github-review` subcommand's use of the API quirks documented in
# `src/github/comments.rs`.
octocrab = { version = "0.54", default-features = false, optional = true, features = [
    "follow-redirect",
    "retry",
    "rustls",
    "timeout",
    "tracing",
    "default-client",
    "rustls-ring",
    "jwt-aws-lc-rs",
] }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[features]
default = ["github-review"]
bridge-tests = []
docgen = ["dep:minijinja"]
# The `github-review` subcommand (`src/github/`, driven by `action.yml`)
# and its dependency stack: octocrab, tokio, and transitively hyper,
# rustls and aws-lc-sys. On by default, so `cargo build`/`cargo install`
# for the binary behave exactly as before. Cargo has no bin-only
# dependencies within a package, and this package also exposes a `[lib]`
# target, so this feature is what lets a library consumer of
# `pg_migration_lint` opt the whole stack out with
# `default-features = false`.
github-review = ["dep:octocrab", "dep:tokio"]

[dependencies.minijinja]
version = "2"
optional = true

[dev-dependencies]
insta = { version = "1.34", features = ["json", "yaml", "redactions"] }
proptest = "1.4"
rstest = "0.26.1"
tempfile = "3.26"
wiremock = "0.6.5"

# `#[tokio::test]` needs the `macros` feature. Kept out of the main
# `[dependencies]` entry above (which only needs `rt-multi-thread` for the
# `github-review` subcommand's runtime) so a plain `cargo build` doesn't
# pull in `tokio-macros` for production code that never uses it.
[dev-dependencies.tokio]
version = "1"
features = ["macros"]
