# Every image is pinned to a PostgreSQL minor. Dependabot bumps the tags on
# each point release; majors are added and removed by hand as the matrix tracks
# supported PostgreSQL majors. gen-fn-volatility.sh and gen-reserved-keywords.sh
# generate Rust source from pg18 and record its version in the file header, so
# a PR that bumps pg18 must also regenerate both files
# (.github/workflows/pg-generators.yml enforces it).
#
# Health checks probe over TCP. The image's first-boot entrypoint runs a temporary
# socket-only server to create POSTGRES_DB and then stops it; a socket probe
# reports healthy during that window, and the first client then fails with
# "the database system is shutting down".
services:
  pg14:
    image: postgres:14.24-alpine
    ports: ["54314:5432"]
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: verify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 10

  pg15:
    image: postgres:15.19-alpine
    ports: ["54315:5432"]
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: verify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 10

  pg16:
    image: postgres:16.15-alpine
    ports: ["54316:5432"]
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: verify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 10

  pg17:
    image: postgres:17.11-alpine
    ports: ["54317:5432"]
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: verify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 10

  pg18:
    image: postgres:18.6-alpine
    ports: ["54318:5432"]
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: verify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 10

  pg19:
    # PostgreSQL 19 has no GA image yet (2026-09-17); move to 19.0-alpine when
    # it lands. Dependabot may not offer that bump from a beta tag.
    image: postgres:19beta3-alpine
    ports: ["54319:5432"]
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: verify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 10
