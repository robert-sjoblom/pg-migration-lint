[advisories]
# Uses the RustSec advisory database. Current cargo-deny errors on vulnerable,
# unmaintained and unsound crates alike; ignore advisories by id, with a reason.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono comes in only through octocrab; no maintained replacement upstream yet" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
